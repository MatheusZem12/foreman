# Foreman: server + Postgres. Start with:  docker compose up -d --build
# Agent sign-in (once):                   docker compose exec foreman claude   (/login)
#                                          docker compose exec foreman codex login --device-auth
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foreman}
      POSTGRES_DB: foreman
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman"]
      interval: 5s
      retries: 20

  foreman:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foreman:${POSTGRES_PASSWORD:-foreman}@db:5432/foreman?sslmode=disable
      FOREMAN_MAX_PARALLEL: ${FOREMAN_MAX_PARALLEL:-3}
      FOREMAN_SECURE_COOKIE: ${FOREMAN_SECURE_COOKIE:-false}
    # Chaves opcionais (ANTHROPIC_API_KEY, OPENAI_API_KEY) e git (GIT_*) ficam no .env.
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data          # clones, worktrees, skills materializadas
      - home:/home/node     # login do claude/codex, ~/.ssh, ~/.gitconfig
    ports:
      # localhost only by default; FOREMAN_BIND=0.0.0.0 exposes it on the network (use HTTPS/VPN).
      - "${FOREMAN_BIND:-127.0.0.1}:${FOREMAN_PORT:-8700}:8700"

  # Direct database access from the browser (optional):
  #   docker compose --profile admin up -d adminer  →  http://localhost:8701
  adminer:
    image: adminer:4
    profiles: ["admin"]
    restart: unless-stopped
    depends_on: [db]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8701}:8080"

volumes:
  db:
  data:
  home:
